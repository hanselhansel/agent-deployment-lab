name: Public evidence checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify public repository contract
        run: python3 -m unittest tests.test_public_safety tests.test_repository_contract -v
      - name: Verify starter workflow
        run: python3 -m unittest discover -s templates/workflow/tests -v
      - name: Scan public material
        run: python3 scripts/check_public_safety.py .
